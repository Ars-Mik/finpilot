services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finpilot
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot_dev_password
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - finpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finpilot -d finpilot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finpilot_postgres_data:
