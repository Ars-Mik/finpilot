name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finpilot_ci
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: ci_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finpilot -d finpilot_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://finpilot:ci_local_password@127.0.0.1:5432/finpilot_ci
      SESSION_SECRET: ci-guest-session-secret-change-in-production
      APP_DATABASE_URL: postgresql://finpilot_app:ci_app_password@127.0.0.1:5432/finpilot_ci
      INTEGRATION_DATABASE_URL: postgresql://finpilot_app:ci_app_password@127.0.0.1:5432/finpilot_ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - run: npm audit --omit=dev

  frontend:
    name: Frontend and UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
