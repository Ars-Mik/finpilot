# Separate QA project, service, port and volume. NEVER points to the development DB.
name: finpilot-security-qa
services:
  postgres-qa:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finpilot_security_qa
      POSTGRES_USER: finpilot_qa_admin
      POSTGRES_PASSWORD: qa_admin_local_only_password
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - postgres_security_qa_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finpilot_qa_admin -d finpilot_security_qa']
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_security_qa_data:
